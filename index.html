<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcon MC - لوحة التحكم والقضايا</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161e2e;
      --card-border: #233044;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Modal / Auth Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 7, 13, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    .modal-card h2 {
      color: var(--accent-green);
      margin-bottom: 15px;
      font-size: 24px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #0d131f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s opacity;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--accent-blue); color: #fff; }
    .btn-success { background: var(--accent-green); color: #fff; }
    .btn-danger { background: var(--accent-red); color: #fff; }
    .btn-warning { background: var(--accent-yellow); color: #111; }
    .btn-sm { width: auto; padding: 6px 12px; font-size: 13px; }

    /* Layout Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-green);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Sidebar & Profile Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #0d131f;
      border-radius: 6px;
    }

    /* News Section */
    .news-item {
      padding: 12px;
      background: #0d131f;
      border-right: 3px solid var(--accent-blue);
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .news-badge {
      background: var(--accent-blue);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
    }

    /* Emergency / Cases Cards */
    .emergency-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      border-right: 4px solid var(--accent-blue);
      transition: all 0.3s ease;
    }

    .emergency-card.status-closed {
      border-right-color: var(--accent-red);
      opacity: 0.85;
    }

    .emergency-card.status-active {
      border-right-color: var(--accent-green);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      background: #233044;
    }

    .controls-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    /* Chat Section Inside Case */
    .chat-container {
      background: #0d131f;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }

    .chat-messages {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 5px;
    }

    .chat-bubble {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      max-width: 85%;
    }

    .chat-bubble.police-msg {
      background: #1e3a8a;
      color: #bfdbfe;
      align-self: flex-start;
    }

    .chat-bubble.user-msg {
      background: #334155;
      color: #f1f5f9;
      align-self: flex-end;
    }

    .chat-bubble.system-msg {
      background: #374151;
      color: #d1d5db;
      align-self: center;
      text-align: center;
      font-size: 11px;
    }

    .chat-input-bar {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. نافذة المصادقة / التسجيل بـ OTP -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <h2>🎮 Falcon MC</h2>
      <p style="color: var(--text-muted); margin-bottom: 20px;" id="authSubtitle">سجل دخولك أو أنشئ حساباً جديداً</p>

      <!-- نموذج طلب OTP -->
      <form id="otpReqForm" onsubmit="handleSendOtp(event)">
        <div class="form-group">
          <label>البريد الإلكتروني:</label>
          <input type="email" id="authEmail" placeholder="example@gmail.com" required>
        </div>

        <div id="registerFields">
          <div class="form-group">
            <label>اسم اللاعب (IGN):</label>
            <input type="text" id="authIgn" placeholder="Steve">
          </div>
          <div class="form-group">
            <label>الاسم الحقيقي الثنائي:</label>
            <input type="text" id="authFullName" placeholder="أحمد علي">
          </div>
          <div class="form-group">
            <label>العمر:</label>
            <input type="number" id="authAge" placeholder="18">
          </div>
        </div>

        <div style="margin-bottom: 15px; text-align: right;">
          <input type="checkbox" id="isLoginCheck" style="width: auto;" onchange="toggleAuthMode()">
          <label for="isLoginCheck" style="display: inline; cursor: pointer;">لدي حساب بالفعل (تسجيل دخول)</label>
        </div>

        <button type="submit" id="sendOtpBtn" class="btn btn-primary">إرسال رمز التحقق 🔑</button>
      </form>

      <!-- نموذج إدخال رمز OTP -->
      <form id="otpVerifyForm" class="hidden" onsubmit="handleVerifyOtp(event)">
        <div class="form-group">
          <label>رمز التحقق (OTP):</label>
          <input type="text" id="authOtp" placeholder="أدخل الرمز المكون من 6 أرقام" required>
        </div>
        <button type="submit" id="verifyOtpBtn" class="btn btn-success">تأكيد الدخول 🚀</button>
      </form>
    </div>
  </div>

  <!-- 2. الهيدر الرئيسي -->
  <header>
    <div class="logo">🎮 Falcon MC</div>
    <div class="header-actions">
      <button onclick="fetchDashboardData()" class="btn btn-primary btn-sm">تحديث البيانات 🔄</button>
      <button onclick="handleLogout()" class="btn btn-danger btn-sm">خروج 🚪</button>
    </div>
  </header>

  <!-- 3. المحتوى الرئيسي للوحة -->
  <div class="container">
    
    <!-- الجانب الأيمن: البيانات الشخصية والأخبار -->
    <aside>
      <!-- ملف اللاعب -->
      <div class="card">
        <h3>👤 بيانات الحساب</h3>
        <div class="profile-info">
          <div class="profile-item"><span>اسم اللاعب:</span><b id="profIgn">---</b></div>
          <div class="profile-item"><span>الاسم الحقيقي:</span><b id="profFullName">---</b></div>
          <div class="profile-item"><span>كود اللاعب:</span><b id="profCode" style="color: var(--accent-blue);">---</b></div>
          <div class="profile-item"><span>المستوى:</span><b id="profLevel">1</b></div>
          <div class="profile-item"><span>الوظيفة:</span><b id="profJob" style="color: var(--accent-green);">مواطن</b></div>
        </div>
      </div>

      <!-- الأخبار والتعميمات -->
      <div class="card">
        <h3>📢 الأخبار والتعميمات</h3>
        <div id="newsList">
          <p class="text-muted">لا توجد أخبار حالية.</p>
        </div>
      </div>
    </aside>

    <!-- الجانب الأيسر: القضايا والبلاغات -->
    <main>
      <!-- نموذج تقديم قضية للمواطن (غير محدود) -->
      <div class="card">
        <h3>🚨 تقديم بلاغ / قضية جديدة</h3>
        <form onsubmit="handleSendEmergency(event)">
          <div class="form-group">
            <label>نوع القضية / البلاغ:</label>
            <select id="emType" required>
              <option value="سرقة 💰">سرقة 💰</option>
              <option value="اعتداء / إطلاق نار 💥">اعتداء / إطلاق نار 💥</option>
              <option value="حادث سير 🚗">حادث سير 🚗</option>
              <option value="خطورة عالية ⚠️">خطورة عالية ⚠️</option>
            </select>
          </div>
          <div class="form-group">
            <label>الموقع والتفاصيل:</label>
            <input type="text" id="emLocation" placeholder="أدخل المكان بالتفصيل أو وصف القضية" required>
          </div>
          <button type="submit" class="btn btn-danger">إرسال القضية إلى مركز الشرطة 🚓</button>
        </form>
      </div>

      <!-- قائمة القضايا -->
      <div class="card">
        <h3>📋 قائمة القضايا المفتوحة والمغلقة</h3>
        <div id="emergenciesList">
          <p class="text-muted">جاري تحميل البيانات...</p>
        </div>
      </div>
    </main>

  </div>

  <!-- JavaScript Code -->
  <script>
    // ⚠️ ضع رابط Apps Script الخاص بك هنا
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-dIJJ8rjiwbt-ZFk3qjSYv6UjoUKC6PXydut-lvR6VYUepOj15o9Db7Dr1hIjSMrLFw/exec";

    let state = {
      email: localStorage.getItem("falcon_email") || "",
      userData: null
    };

    window.onload = () => {
      if (state.email) {
        document.getElementById("authModal").classList.add("hidden");
        fetchDashboardData();
      }
    };

    function toggleAuthMode() {
      const isLogin = document.getElementById("isLoginCheck").checked;
      document.getElementById("registerFields").classList.toggle("hidden", isLogin);
    }

    // --- 1. عمليات المصادقة ---
    async function handleSendOtp(e) {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const ign = document.getElementById("authIgn").value.trim();
      const fullName = document.getElementById("authFullName").value.trim();
      const age = document.getElementById("authAge").value.trim();
      const isLogin = document.getElementById("isLoginCheck").checked;

      const btn = document.getElementById("sendOtpBtn");
      btn.innerText = "جاري الإرسال...";
      btn.disabled = true;

      try {
        const res = await apiCall({
          action: "sendOtp",
          email: email,
          ign: ign,
          fullName: fullName,
          age: age,
          isLogin: isLogin
        });

        if (res.status === "success") {
          state.email = email;
          document.getElementById("otpReqForm").classList.add("hidden");
          document.getElementById("otpVerifyForm").classList.remove("hidden");
          document.getElementById("authSubtitle").innerText = "أدخل رمز OTP المرسل إلى بريدك الإلكتروني";
        } else {
          alert("خطأ: " + res.message);
        }
      } catch (err) {
        alert("فشل الاتصال بالسيرفر!");
      } finally {
        btn.innerText = "إرسال رمز التحقق 🔑";
        btn.disabled = false;
      }
    }

    async function handleVerifyOtp(e) {
      e.preventDefault();
      const otp = document.getElementById("authOtp").value.trim();
      const btn = document.getElementById("verifyOtpBtn");
      btn.innerText = "جاري التحقق...";
      btn.disabled = true;

      try {
        const res = await apiCall({
          action: "verifyOtp",
          email: state.email,
          otp: otp
        });

        if (res.status === "success") {
          localStorage.setItem("falcon_email", state.email);
          document.getElementById("authModal").classList.add("hidden");
          renderDashboard(res);
        } else {
          alert("خطأ: " + res.message);
        }
      } catch (err) {
        alert("فشل التحقق من الرمز!");
      } finally {
        btn.innerText = "تأكيد الدخول 🚀";
        btn.disabled = false;
      }
    }

    // --- 2. جلب وتحديث بيانات اللوحة ---
    async function fetchDashboardData() {
      if (!state.email) return;
      try {
        const res = await apiCall({
          action: "getDashboardData",
          email: state.email
        });
        if (res.status === "success") {
          renderDashboard(res);
        } else {
          handleLogout();
        }
      } catch (err) {
        console.error("فشل تحديث البيانات:", err);
      }
    }

    function renderDashboard(data) {
      state.userData = data;

      // تحديث ملف اللاعب
      document.getElementById("profIgn").innerText = data.ign;
      document.getElementById("profFullName").innerText = data.fullName;
      document.getElementById("profCode").innerText = data.playerCode;
      document.getElementById("profLevel").innerText = data.level;
      document.getElementById("profJob").innerText = data.job;

      // عرض الأخبار
      const newsContainer = document.getElementById("newsList");
      newsContainer.innerHTML = "";
      if (data.news && data.news.length > 0) {
        data.news.forEach(item => {
          newsContainer.innerHTML += `
            <div class="news-item">
              <div><b>${item.title}</b> <span class="news-badge">${item.badge}</span></div>
              <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">${item.content}</p>
              <small style="font-size: 10px; color: #6b7280;">${item.date}</small>
            </div>
          `;
        });
      } else {
        newsContainer.innerHTML = `<p class="text-muted">لا توجد أخبار جديدة.</p>`;
      }

      // عرض القضايا
      const list = data.isPolice ? data.allEmergenciesForPolice : data.myEmergencies;
      renderEmergencies(list, data.isPolice);
    }

    // --- 3. عرض القضايا والتحكم الخاص بالشرطة والمواطن ---
    function renderEmergencies(list, isPolice) {
      const container = document.getElementById("emergenciesList");
      container.innerHTML = "";

      if (!list || list.length === 0) {
        container.innerHTML = "<p class='text-muted'>لا توجد قضايا مسجلة حالياً.</p>";
        return;
      }

      list.forEach(item => {
        const isClosed = item.status.includes("مغلقة");
        const isWorking = item.status.includes("المباشرة");

        // أزرار التحكم للشرطة
        let policeActions = "";
        if (isPolice) {
          policeActions = `
            <div class="controls-group">
              ${!isWorking && !isClosed ? `
                <button onclick="handlePoliceAction('acceptEmergency', ${item.rowId})" class="btn btn-success btn-sm">مباشرة القضية 🚔</button>
              ` : ''}
              
              ${!isClosed ? `
                <button onclick="handlePoliceAction('closeEmergency', ${item.rowId})" class="btn btn-danger btn-sm">إلغاء / إغلاق القضية 🔒</button>
              ` : `
                <button onclick="handlePoliceAction('reopenEmergency', ${item.rowId})" class="btn btn-warning btn-sm">إعادة فتح القضية 🔓</button>
              `}
            </div>
          `;
        }

        // محادثات القضية
        let chatContent = (item.chatMessages || []).map(msg => `
          <div class="chat-bubble ${msg.isPolice ? 'police-msg' : (msg.senderName === 'النظام' ? 'system-msg' : 'user-msg')}">
            <b>${msg.senderName}:</b> ${msg.text}
          </div>
        `).join("");

        const card = document.createElement("div");
        card.className = `emergency-card ${isClosed ? 'status-closed' : (isWorking ? 'status-active' : '')}`;
        card.innerHTML = `
          <div class="card-top">
            <h4 style="color: var(--accent-blue);">قضية #${item.rowId} - ${item.type}</h4>
            <span class="badge">${item.status}</span>
          </div>
          <p style="font-size: 14px;"><b>صاحب البلاغ:</b> ${item.fullName} (${item.playerCode})</p>
          <p style="font-size: 14px;"><b>الموقع / التفاصيل:</b> ${item.location}</p>
          <p style="font-size: 13px; color: var(--text-muted);"><b>الضابط المباشر:</b> ${item.officerName}</p>
          <small style="font-size: 11px; color: #6b7280;">التاريخ: ${item.date}</small>

          ${policeActions}

          <!-- محادثة القضية -->
          <div class="chat-container">
            <h5 style="font-size: 13px; margin-bottom: 5px;">💬 المحادثة المباشرة:</h5>
            <div class="chat-messages" id="chatBox-${item.rowId}">
              ${chatContent || '<p class="text-muted" style="font-size: 12px;">لا توجد رسائل بعد.</p>'}
            </div>
            
            ${!isClosed ? `
              <div class="chat-input-bar">
                <input type="text" id="chatInput-${item.rowId}" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendChatMessage(${item.rowId})">
                <button onclick="sendChatMessage(${item.rowId})" class="btn btn-primary btn-sm">إرسال</button>
              </div>
            ` : '<p style="font-size: 11px; color: var(--accent-red); margin-top: 5px;"><i>هذه القضية مغلقة ولا يمكن إرسال رسائل بها.</i></p>'}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // --- 4. إرسال بلاغ جديد (للمواطن) ---
    async function handleSendEmergency(e) {
      e.preventDefault();
      const type = document.getElementById("emType").value;
      const location = document.getElementById("emLocation").value.trim();

      const res = await apiCall({
        action: "sendEmergency",
        playerCode: state.userData.playerCode,
        fullName: state.userData.fullName,
        type: type,
        location: location
      });

      if (res.status === "success") {
        alert(res.message);
        document.getElementById("emLocation").value = "";
        fetchDashboardData();
      }
    }

    // --- 5. أوامر الشرطة (مباشرة / إغلاق / إعادة فتح) ---
    async function handlePoliceAction(actionType, rowId) {
      if (actionType === 'closeEmergency' && !confirm("هل تريد تأكيد إلغاء وإغلاق هذه القضية؟")) return;

      const res = await apiCall({
        action: actionType,
        rowId: rowId,
        officerName: state.userData.fullName
      });

      if (res.status === "success") {
        fetchDashboardData();
      }
    }

    // --- 6. إرسال رسالة في الشات ---
    async function sendChatMessage(rowId) {
      const input = document.getElementById(`chatInput-${rowId}`);
      const text = input.value.trim();
      if (!text) return;

      const res = await apiCall({
        action: "sendChatMessage",
        rowId: rowId,
        senderName: state.userData.fullName,
        text: text,
        isPolice: state.userData.isPolice
      });

      if (res.status === "success") {
        input.value = "";
        fetchDashboardData();
      }
    }

    // --- 7. دالة المساعدة للاتصال بـ Apps Script ---
    async function apiCall(data) {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      return await response.json();
    }

    function handleLogout() {
      localStorage.removeItem("falcon_email");
      location.reload();
    }
  </script>
</body>
</html>
