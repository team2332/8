<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcon MC - لوحة اللاعبين</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --accent: #10b981;
      --accent-hover: #059669;
      --primary: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 900px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
    
    h1, h2, h3 { color: #fff; margin-bottom: 15px; }
    .brand-title { color: var(--accent); text-align: center; font-size: 2rem; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.9rem; }
    input { width: 100%; padding: 12px; background: #1e293b; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--accent); }
    
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #1e293b; color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .info-box { background: #1e293b; border: 1px solid var(--border); padding: 15px; border-radius: 10px; text-align: center; }
    .info-box span { display: block; font-size: 0.85rem; color: var(--text-muted); }
    .info-box strong { font-size: 1.2rem; color: var(--accent); word-break: break-all; }
    
    .section-box { background: #111827; border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-top: 15px; }
    .list-item { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid var(--accent); }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; background: var(--primary); color: #fff; margin-bottom: 5px; }
    
    .hidden { display: none !important; }
    .alert { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }
    .alert-error { background: #7f1d1d; color: #fca5a5; }
    .alert-success { background: #064e3b; color: #6ee7b7; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- تسجيل الدخول وإنشاء الحساب -->
  <div id="authContainer" class="card">
    <h1 class="brand-title">🎮 Falcon MC</h1>
    
    <div class="tabs">
      <button class="tab-btn active" id="tabSignupBtn" onclick="switchAuthMode('signup')">حساب جديد</button>
      <button class="tab-btn" id="tabLoginBtn" onclick="switchAuthMode('login')">تسجيل دخول</button>
    </div>

    <div id="alertMsg" class="alert hidden"></div>

    <!-- 1. نموذج طلب الـ OTP -->
    <form id="otpReqForm" onsubmit="handleSendOtp(event)">
      <div id="signupFields">
        <div class="form-group">
          <label for="ign">اسمك في اللعبة (IGN)</label>
          <input type="text" id="ign" placeholder="مثال: Steve_99">
        </div>
        <div class="form-group">
          <label for="fullName">الاسم الكامل</label>
          <input type="text" id="fullName" placeholder="الاسم الثلاثي">
        </div>
        <div class="form-group">
          <label for="age">السن</label>
          <input type="number" id="age" placeholder="18">
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <button type="submit" id="sendOtpBtn" class="btn">إرسال رمز التحقق (OTP)</button>
    </form>

    <!-- 2. نموذج تأكيد الـ OTP -->
    <form id="otpVerifyForm" class="hidden" onsubmit="handleVerifyOtp(event)">
      <p style="text-align: center; margin-bottom: 15px; color: var(--text-muted);">
        تم إرسال رمز التحقق إلى بريدك الإلكتروني.
      </p>
      <div class="form-group">
        <label for="otpCode">رمز التحقق (OTP)</label>
        <input type="text" id="otpCode" placeholder="أدخل الـ 6 أرقام" required maxlength="6">
      </div>
      <button type="submit" id="verifyOtpBtn" class="btn">تأكيد والدخول</button>
      <button type="button" class="btn btn-secondary" onclick="resetAuthForm()">تغيير البريد</button>
    </form>
  </div>

  <!-- لوحة التحكم (Dashboard) -->
  <div id="dashboardContainer" class="card hidden">
    <h2 style="display: flex; justify-content: space-between; align-items: center;">
      <span>أهلاً بك، <span id="dashIgn" style="color: var(--accent);"></span></span>
      <button class="btn btn-secondary" style="width: auto; padding: 5px 15px; font-size: 0.85rem;" onclick="logout()">خروج</button>
    </h2>

    <div class="profile-grid">
      <div class="info-box">
        <span>كود اللاعب</span>
        <strong id="dashPlayerCode">---</strong>
      </div>
      <div class="info-box">
        <span>البريد الإلكتروني</span>
        <strong id="dashEmail" style="font-size: 0.9rem; color: #fff;">---</strong>
      </div>
    </div>

    <!-- الأخبار والإعلانات -->
    <div class="section-box">
      <h3>📢 آخر الأخبار والإعلانات</h3>
      <div id="newsList">لا توجد أخبار حالياً.</div>
    </div>

    <!-- القضايا والسجلات -->
    <div class="section-box">
      <h3>⚖️ سجل القضايا الخاص بك</h3>
      <div id="casesList">لا توجد قضايا مسجلة باسمك.</div>
    </div>
  </div>

</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnphtNUkaX2silg0lMcXSi3Gi5YMMXNJ32ncHekfxWhAKi-4E2m1FVeBUQYpBA32ISxw/exec";

  let isLoginMode = false;
  let currentEmail = "";

  window.onload = function() {
    checkSavedSession();
  };

  function showAlert(msg, type = "error") {
    const el = document.getElementById("alertMsg");
    el.className = `alert alert-${type}`;
    el.innerText = msg;
    el.classList.remove("hidden");
  }

  function hideAlert() {
    document.getElementById("alertMsg").classList.add("hidden");
  }

  function switchAuthMode(mode) {
    hideAlert();
    isLoginMode = (mode === 'login');
    document.getElementById("tabSignupBtn").className = `tab-btn ${!isLoginMode ? 'active' : ''}`;
    document.getElementById("tabLoginBtn").className = `tab-btn ${isLoginMode ? 'active' : ''}`;
    
    if (isLoginMode) {
      document.getElementById("signupFields").classList.add("hidden");
    } else {
      document.getElementById("signupFields").classList.remove("hidden");
    }
  }

  async function handleSendOtp(e) {
    e.preventDefault();
    hideAlert();
    
    currentEmail = document.getElementById("email").value.trim();
    const ign = document.getElementById("ign").value.trim();
    const fullName = document.getElementById("fullName").value.trim();
    const age = document.getElementById("age").value.trim();

    if (!isLoginMode && !ign) {
      return showAlert("يرجى كتابة اسمك في اللعبة (IGN)");
    }

    const btn = document.getElementById("sendOtpBtn");
    btn.disabled = true;
    btn.innerText = "جاري الإرسال...";

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "sendOtp",
          email: currentEmail,
          ign: ign,
          fullName: fullName,
          age: age,
          isLogin: isLoginMode
        })
      });

      const data = await res.json();
      btn.disabled = false;
      btn.innerText = "إرسال رمز التحقق (OTP)";

      if (data.status === "success") {
        document.getElementById("otpReqForm").classList.add("hidden");
        document.getElementById("otpVerifyForm").classList.remove("hidden");
      } else {
        showAlert(data.message || "حدث خطأ أثناء الإرسال");
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerText = "إرسال رمز التحقق (OTP)";
      showAlert("فشل الاتصال بالسيرفر.");
    }
  }

  async function handleVerifyOtp(e) {
    e.preventDefault();
    hideAlert();

    const otp = document.getElementById("otpCode").value.trim();
    const btn = document.getElementById("verifyOtpBtn");
    btn.disabled = true;
    btn.innerText = "جاري التحقق...";

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "verifyOtp",
          email: currentEmail,
          otp: otp
        })
      });

      const data = await res.json();
      btn.disabled = false;
      btn.innerText = "تأكيد والدخول";

      if (data.status === "success") {
        localStorage.setItem("falcon_user", JSON.stringify({
          email: currentEmail,
          ign: data.ign,
          playerCode: data.playerCode
        }));

        loadDashboard(data);
      } else {
        showAlert(data.message || "رمز التحقق غير صحيح");
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerText = "تأكيد والدخول";
      showAlert("حدث خطأ أثناء التحقق من الرمز.");
    }
  }

  function loadDashboard(data) {
    document.getElementById("authContainer").classList.add("hidden");
    document.getElementById("dashboardContainer").classList.remove("hidden");

    document.getElementById("dashIgn").innerText = data.ign || "لاعب";
    document.getElementById("dashPlayerCode").innerText = data.playerCode || "---";
    document.getElementById("dashEmail").innerText = currentEmail;

    const newsBox = document.getElementById("newsList");
    if (data.news && data.news.length > 0) {
      newsBox.innerHTML = data.news.map(item => `
        <div class="list-item">
          <span class="badge">${item.badge}</span>
          <strong style="display:block; margin: 2px 0;">${item.title}</strong>
          <p style="font-size:0.9rem; color:var(--text-muted);">${item.content}</p>

          <small style="color:#64748b; display:block; margin-top:5px;">${item.date}</small>
        </div>
      `).join("");
    } else {
      newsBox.innerHTML = "<p style='color:var(--text-muted);'>لا توجد أخبار جديدة.</p>";
    }

    const casesBox = document.getElementById("casesList");
    if (data.cases && data.cases.length > 0) {
      casesBox.innerHTML = data.cases.map(c => `
        <div class="list-item" style="border-right-color: #ef4444;">
          <strong>رقم القضية: ${c.caseNum} - ${c.title}</strong>
          <p style="font-size:0.9rem; margin-top:4px;">${c.details}</p>
          <div style="font-size:0.85rem; margin-top:6px; color:var(--text-muted);">
            <span>الحالة: <b style="color:#f59e0b;">${c.status}</b></span> | 
            <span>العقوبة: <b>${c.penalty}</b></span>
          </div>
        </div>
      `).join("");
    } else {
      casesBox.innerHTML = "<p style='color:var(--text-muted);'>حسابك نظيف، لا توجد قضايا مسجلة.</p>";
    }
  }

  async function checkSavedSession() {
    const saved = localStorage.getItem("falcon_user");
    if (saved) {
      const user = JSON.parse(saved);
      currentEmail = user.email;
      
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "getDashboardData",
            email: currentEmail
          })
        });
        const data = await res.json();
        if (data.status === "success") {
          loadDashboard(data);
        }
      } catch (e) {
        console.log("فشل تجديد الجلسة تلقائياً");
      }
    }
  }

  function resetAuthForm() {
    document.getElementById("otpReqForm").classList.remove("hidden");
    document.getElementById("otpVerifyForm").classList.add("hidden");
    hideAlert();
  }

  function logout() {
    localStorage.removeItem("falcon_user");
    location.reload();
  }
</script>
</body>
</html>
