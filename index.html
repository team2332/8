<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 🔍 SEO Metatags -->
  <title>Falcon Roleplay - Portal</title>
  <meta name="description" content="البوابة الرسمية لسيرفر Falcon Roleplay - متابعة البلاغات والقضايا والأخبار لحظة بلحظة.">
  <meta name="keywords" content="Falcon, Minecraft, Roleplay, فالكون, سيرفر فالكون">
  <meta name="robots" content="index, follow">

  <style>
    :root {
      --bg-main: #0c0214;
      --bg-card: rgba(22, 8, 38, 0.75);
      --bg-card-hover: rgba(35, 12, 60, 0.85);
      --border-color: rgba(230, 0, 122, 0.25);
      --border-cyan: rgba(0, 166, 255, 0.3);
      
      --neon-pink: #e6007a;
      --neon-cyan: #00a6ff;
      --neon-purple: #9d00ff;
      --neon-green: #00ff88;
      --neon-red: #ff2a6d;
      
      --text-main: #f8fafc;
      --text-muted: #a1a1aa;
      
      --glow-pink: 0 0 20px rgba(230, 0, 122, 0.4);
      --glow-cyan: 0 0 20px rgba(0, 166, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(230, 0, 122, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 166, 255, 0.15) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      user-select: none;
      overflow-x: hidden;
    }

    /* --- Page View Controller --- */
    .page-view {
      min-height: 100vh;
      width: 100%;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .hidden {
      display: none !important;
    }

    /* --- FULL PAGE 1: AUTH PAGE --- */
    #authPage {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      box-shadow: var(--glow-pink);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      position: relative;
    }

    .auth-logo-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
      padding: 3px;
      box-shadow: var(--glow-cyan);
    }

    .auth-logo-inner {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .auth-title {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    /* --- FULL PAGE 2: DASHBOARD PAGE --- */
    header {
      background: rgba(12, 2, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-actions {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      left: 0;
      top: 45px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      box-shadow: var(--glow-cyan);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      width: 180px;
      overflow: hidden;
      z-index: 101;
    }

    .dropdown-menu.show { display: flex; }

    .dropdown-item {
      padding: 12px 16px;
      color: var(--text-main);
      background: none;
      border: none;
      text-align: right;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    .dropdown-item:hover {
      background: rgba(0, 166, 255, 0.15);
      color: var(--neon-cyan);
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }

    /* --- Cards & UI Elements --- */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 25px;
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(0, 166, 255, 0.4);
    }

    .card-header {
      font-size: 17px;
      font-weight: 700;
      color: var(--neon-cyan);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- Form Elements --- */
    .form-group { margin-bottom: 18px; text-align: right; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(12, 2, 20, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 166, 255, 0.3);
    }

    /* --- Buttons --- */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-pink {
      background: linear-gradient(135deg, var(--neon-pink), #a00055);
      color: #fff;
      box-shadow: var(--glow-pink);
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--neon-cyan), #0066b3);
      color: #fff;
      box-shadow: var(--glow-cyan);
    }

    .btn-green { background: var(--neon-green); color: #000; }
    .btn-red { background: var(--neon-red); color: #fff; }
    .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }

    .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }

    /* --- User Profile Card --- */
    .profile-badge {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }
    .avatar {
      width: 55px; height: 55px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold;
    }

    /* --- News Section --- */
    .news-card {
      background: rgba(12, 2, 20, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .news-tag {
      background: var(--neon-pink);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* --- Emergency & Chat Cards --- */
    .emergency-item {
      background: rgba(12, 2, 20, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .emergency-item.active { border-right: 4px solid var(--neon-cyan); }
    .emergency-item.closed { border-right: 4px solid var(--neon-red); opacity: 0.75; }

    .chat-box {
      background: rgba(18, 4, 30, 0.8);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }
    .chat-logs {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .msg-bubble {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      max-width: 85%;
    }
    .msg-user { background: rgba(0, 166, 255, 0.15); border: 1px solid var(--border-cyan); align-self: flex-start; }
    .msg-police { background: rgba(230, 0, 122, 0.2); border: 1px solid var(--border-color); align-self: flex-end; }
    .msg-system { background: rgba(255,255,255,0.05); color: var(--neon-cyan); text-align: center; width: 100%; }

    /* --- Modal Overlay --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(12, 2, 20, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-cyan);
      box-shadow: var(--glow-cyan);
      border-radius: 18px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
    }
  </style>
</head>
<body>

  <!-- ================= 🚪 FULL PAGE 1: AUTH PAGE ================= -->
  <div id="authPage" class="page-view">
    <div class="auth-card">
      <div class="auth-logo-wrapper">
        <div class="auth-logo-inner">🦅</div>
      </div>
      <h2 class="auth-title">FALCON PORTAL</h2>
      <p id="authSubtitle" style="font-size: 13px; color: var(--text-muted); margin-bottom: 25px;">بوابة الدخول الموحدة لاعبي فالكون</p>

      <form id="otpReqForm" onsubmit="handleSendOtp(event)">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="authEmail" required placeholder="example@falcon.com">
        </div>
        <div id="registerFields">
          <div class="form-group">
            <label>اسم اللاعب (IGN)</label>
            <input type="text" id="authIgn" placeholder="Falcon_Player">
          </div>
          <div class="form-group">
            <label>الاسم الثلاثي</label>
            <input type="text" id="authFullName" placeholder="الاسم الحقيقي">
          </div>
          <div class="form-group">
            <label>العمر</label>
            <input type="number" id="authAge" placeholder="18">
          </div>
        </div>
        <div style="margin-bottom: 20px; text-align: right;">
          <input type="checkbox" id="isLoginCheck" style="width: auto;" onchange="toggleAuthMode()">
          <label for="isLoginCheck" style="display: inline; cursor: pointer; color: var(--neon-cyan);">لدي حساب بالفعل (تسجيل دخول)</label>
        </div>
        <button type="submit" id="sendOtpBtn" class="btn btn-pink" style="width: 100%;">إرسال رمز التحقق 🔑</button>
      </form>

      <form id="otpVerifyForm" class="hidden" onsubmit="handleVerifyOtp(event)">
        <div class="form-group">
          <label>رمز التحقق (OTP)</label>
          <input type="text" id="authOtp" required placeholder="أدخل الكود المكون من 6 أرقام">
        </div>
        <button type="submit" id="verifyOtpBtn" class="btn btn-cyan" style="width: 100%;">تأكيد الدخول ودخول السيرفر 🚀</button>
      </form>
    </div>
  </div>

  <!-- ================= 🌐 FULL PAGE 2: DASHBOARD PAGE ================= -->
  <div id="dashboardPage" class="page-view hidden">
    <header>
      <div class="brand-logo">🦅 FALCON ROLEPLAY</div>
      <div class="nav-actions">
        <button onclick="toggleMenu()" class="btn btn-cyan btn-sm">القائمة ☰</button>
        <div id="navDropdown" class="dropdown-menu">
          <button onclick="openComplaintModal()" class="dropdown-item">تقديم شكوى 📋</button>
          <button onclick="handleLogout()" class="dropdown-item" style="color: var(--neon-red);">تسجيل الخروج 🚪</button>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- الجانب الأيسر: البروفايل والأخبار -->
      <div>
        <div class="card">
          <div class="profile-badge">
            <div class="avatar" id="avatarLetter">F</div>
            <div>
              <h3 id="profFullName" style="font-size: 16px; font-weight: 800;">...</h3>
              <p id="profIgn" style="font-size: 12px; color: var(--neon-cyan);">@...</p>
            </div>
          </div>
          <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">الكود الشخصي: <b id="profCode" style="color: var(--neon-pink);">...</b></p>
          <p style="font-size: 13px; color: var(--text-muted);">المستوى: <b id="profLevel" style="color:#fff;">1</b> | الوظيفة: <b id="profJob" style="color:#fff;">مواطن</b></p>
        </div>

        <div class="card">
          <div class="card-header">📢 الأخبار والتعميمات</div>
          <div id="newsList">
            <p style="font-size: 12px; color: var(--text-muted);">جاري تحميل الأخبار...</p>
          </div>
        </div>
      </div>

      <!-- الجانب الأيمن: البلاغات والشات -->
      <div>
        <div class="card">
          <div class="card-header">🚨 إرسال بلاغ عاجل للشرطة</div>
          <form onsubmit="handleSendEmergency(event)">
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
              <div class="form-group">
                <label>نوع البلاغ</label>
                <select id="emType">
                  <option value="طلب شرطة 🚔">طلب شرطة 🚔</option>
                  <option value="بلاغ سرقة 💰">بلاغ سرقة 💰</option>
                  <option value="حالة طوارئ ⚠️">حالة طوارئ ⚠️</option>
                </select>
              </div>
              <div class="form-group">
                <label>تفاصيل الموقع / البلاغ</label>
                <input type="text" id="emLocation" required placeholder="الموقع بالتفصيل...">
              </div>
            </div>
            <button type="submit" class="btn btn-pink" style="width: 100%;">إرسال النداء العاجل 📡</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header">💬 القضايا النشطة والمحادثات المباشرة</div>
          <div id="emergenciesList">
            <p style="font-size: 12px; color: var(--text-muted);">جاري تحميل القضايا...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🚨 Modal الشكاوى -->
  <div id="complaintModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="color: var(--neon-cyan);">تقديم شكوى رسمية 📋</h3>
        <button onclick="closeComplaintModal()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:18px;">✕</button>
      </div>
      <form onsubmit="handleSendEmergencyModal(event)">
        <div class="form-group">
          <label>نوع الشكوى</label>
          <select id="modalEmType">
            <option value="سرقة / احتيال">سرقة / احتيال</option>
            <option value="اعتداء / قتل">اعتداء / قتل</option>
            <option value="شكوى ضد لاعب">شكوى ضد لاعب</option>
            <option value="مخالفة قوانين السيرفر">مخالفة قوانين السيرفر</option>
          </select>
        </div>
        <div class="form-group">
          <label>تفاصيل الشكوى</label>
          <textarea id="modalEmLocation" rows="4" required placeholder="اكتب الشكوى والمسؤولين عنها..."></textarea>
        </div>
        <button type="submit" class="btn btn-cyan" style="width: 100%;">إرسال الشكوى للإدارة 🚀</button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ ضع رابط Apps Script الخاص بك هنا
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-dIJJ8rjiwbt-ZFk3qjSYv6UjoUKC6PXydut-lvR6VYUepOj15o9Db7Dr1hIjSMrLFw/exec";

    let state = {
      email: localStorage.getItem("falcon_email") || "",
      userData: null
    };

    let isUserTyping = false;

    // --- 🔒 حماية أدوات المطور (F12) والماوس الأيمن ---
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
      if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // --- 🚀 التبديل بين الصفحات وإدارة الجلسة ---
    window.onload = () => {
      if (state.email) {
        switchPage('dashboardPage');
        fetchDashboardData(false);
      } else {
        switchPage('authPage');
      }

      document.addEventListener("click", (e) => {
        if (!e.target.closest('.nav-actions')) {
          document.getElementById("navDropdown").classList.remove("show");
        }
      });

      // منع التقطيع أثناء الكتابة
      document.addEventListener('focusin', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          isUserTyping = true;
        }
      });

      document.addEventListener('focusout', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          setTimeout(() => {
            const active = document.activeElement;
            if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')) {
              isUserTyping = false;
            }
          }, 500);
        }
      });

      // التحديث الصامت الذكي
      setInterval(() => {
        if (state.email && !isUserTyping) {
          fetchDashboardData(true);
        }
      }, 4000);
    };

    function switchPage(pageId) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    }

    function toggleMenu() { document.getElementById("navDropdown").classList.toggle("show"); }
    function openComplaintModal() { document.getElementById("navDropdown").classList.remove("show"); document.getElementById("complaintModal").classList.remove("hidden"); }
    function closeComplaintModal() { document.getElementById("complaintModal").classList.add("hidden"); }
    function toggleAuthMode() {
      const isLogin = document.getElementById("isLoginCheck").checked;
      document.getElementById("registerFields").classList.toggle("hidden", isLogin);
    }

    // --- 🔑 الدخول والـ OTP ---
    async function handleSendOtp(e) {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const ign = document.getElementById("authIgn").value.trim();
      const fullName = document.getElementById("authFullName").value.trim();
      const age = document.getElementById("authAge").value.trim();
      const isLogin = document.getElementById("isLoginCheck").checked;

      const btn = document.getElementById("sendOtpBtn");
      btn.innerText = "جاري الإرسال..."; btn.disabled = true;

      try {
        const res = await apiCall({ action: "sendOtp", email, ign, fullName, age, isLogin });
        if (res.status === "success") {
          state.email = email;
          document.getElementById("otpReqForm").classList.add("hidden");
          document.getElementById("otpVerifyForm").classList.remove("hidden");
          document.getElementById("authSubtitle").innerText = "أدخل رمز OTP المرسل لإيميلك";
        } else { alert("خطأ: " + res.message); }
      } catch (err) { alert("فشل الاتصال بالسيرفر!"); }
      finally { btn.innerText = "إرسال رمز التحقق 🔑"; btn.disabled = false; }
    }

    async function handleVerifyOtp(e) {
      e.preventDefault();
      const otp = document.getElementById("authOtp").value.trim();
      const btn = document.getElementById("verifyOtpBtn");
      btn.innerText = "جاري التحقق..."; btn.disabled = true;

      try {
        const res = await apiCall({ action: "verifyOtp", email: state.email, otp });
        if (res.status === "success") {
          localStorage.setItem("falcon_email", state.email);
          switchPage('dashboardPage');
          renderDashboard(res, false);
        } else { alert("خطأ: " + res.message); }
      } catch (err) { alert("فشل التحقق!"); }
      finally { btn.innerText = "تأكيد الدخول ودخول السيرفر 🚀"; btn.disabled = false; }
    }

    // --- 📊 جلب وتحديث البيانات ---
    async function fetchDashboardData(isSilent = false) {
      if (!state.email) return;
      try {
        const res = await apiCall({ action: "getDashboardData", email: state.email });
        if (res.status === "success") { renderDashboard(res, isSilent); }
        else if (!isSilent) { handleLogout(); }
      } catch (err) {}
    }

    function renderDashboard(data, isSilent = false) {
      state.userData = data;

      document.getElementById("profFullName").innerText = data.fullName || "لاعب فالكون";
      document.getElementById("profIgn").innerText = "@" + (data.ign || "player");
      document.getElementById("profCode").innerText = data.playerCode || "---";
      document.getElementById("profLevel").innerText = data.level || "1";
      document.getElementById("profJob").innerText = data.job || "مواطن";
      document.getElementById("avatarLetter").innerText = (data.fullName || "F").charAt(0).toUpperCase();

      const newsContainer = document.getElementById("newsList");
      if (data.news && data.news.length > 0) {
        newsContainer.innerHTML = data.news.map(item => `
          <div class="news-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <b>${item.title}</b> <span class="news-tag">${item.badge}</span>
            </div>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">${item.content}</p>
          </div>
        `).join("");
      } else {
        newsContainer.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">لا توجد أخبار جديدة.</p>`;
      }

      const list = data.isPolice ? data.allEmergenciesForPolice : data.myEmergencies;
      renderEmergencies(list, data.isPolice, isSilent);
    }

    // --- 💬 عرض البلاغات والشات الصامت ---
    function renderEmergencies(list, isPolice, isSilent) {
      const container = document.getElementById("emergenciesList");
      if (!list || list.length === 0) {
        container.innerHTML = "<p style='font-size:12px; color:var(--text-muted);'>لا توجد قضايا مسجلة حالياً.</p>";
        return;
      }

      if (isSilent && container.children.length === list.length) {
        list.forEach(item => {
          const chatBox = document.getElementById(`chatBox-${item.rowId}`);
          if (chatBox) {
            let chatContent = (item.chatMessages || []).map(msg => `
              <div class="msg-bubble ${msg.isPolice ? 'msg-police' : (msg.senderName === 'النظام' ? 'msg-system' : 'msg-user')}">
                <b>${msg.senderName}:</b> ${msg.text}
              </div>
            `).join("");
            
            if (chatBox.innerHTML.trim() !== chatContent.trim()) {
              chatBox.innerHTML = chatContent || '<p style="font-size: 11px; color: var(--text-muted);">لا توجد رسائل بعد.</p>';
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          }
        });
        return;
      }

      container.innerHTML = "";
      list.forEach(item => {
        const isClosed = item.status.includes("مغلقة");
        const isWorking = item.status.includes("المباشرة");

        let policeActions = "";
        if (isPolice) {
          policeActions = `
            <div style="display:flex; gap:8px; margin: 10px 0;">
              ${!isWorking && !isClosed ? `<button onclick="handlePoliceAction('acceptEmergency', ${item.rowId})" class="btn btn-green btn-sm">مباشرة القضية 🚔</button>` : ''}
              ${!isClosed ? `<button onclick="handlePoliceAction('closeEmergency', ${item.rowId})" class="btn btn-red btn-sm">إغلاق القضية 🔒</button>` : `<button onclick="handlePoliceAction('reopenEmergency', ${item.rowId})" class="btn btn-cyan btn-sm">إعادة فتح 🔓</button>`}
            </div>
          `;
        }

        let chatContent = (item.chatMessages || []).map(msg => `
          <div class="msg-bubble ${msg.isPolice ? 'msg-police' : (msg.senderName === 'النظام' ? 'msg-system' : 'msg-user')}">
            <b>${msg.senderName}:</b> ${msg.text}
          </div>
        `).join("");

        const card = document.createElement("div");
        card.className = `emergency-item ${isClosed ? 'closed' : 'active'}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h4 style="color:var(--neon-pink);">قضية #${item.rowId} - ${item.type}</h4>
            <span class="news-tag">${item.status}</span>
          </div>
          <p style="font-size: 13px;"><b>المبلغ:</b> ${item.fullName} (${item.playerCode})</p>
          <p style="font-size: 13px;"><b>الموقع:</b> ${item.location}</p>
          <p style="font-size: 12px; color: var(--text-muted);"><b>الضابط:</b> ${item.officerName}</p>

          ${policeActions}

          <div class="chat-box">
            <div class="chat-logs" id="chatBox-${item.rowId}">
              ${chatContent || '<p style="font-size: 11px; color: var(--text-muted);">لا توجد رسائل بعد.</p>'}
            </div>
            ${!isClosed ? `
              <div style="display:flex; gap:6px;">
                <input type="text" id="chatInput-${item.rowId}" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendChatMessage(${item.rowId})">
                <button onclick="sendChatMessage(${item.rowId})" class="btn btn-cyan btn-sm">إرسال</button>
              </div>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- 📤 التفاعلات وإرسال الأوامر ---
    async function handleSendEmergency(e) {
      e.preventDefault();
      const type = document.getElementById("emType").value;
      const location = document.getElementById("emLocation").value.trim();
      await submitEmergency(type, location, () => { document.getElementById("emLocation").value = ""; });
    }

    async function handleSendEmergencyModal(e) {
      e.preventDefault();
      const type = document.getElementById("modalEmType").value;
      const location = document.getElementById("modalEmLocation").value.trim();
      await submitEmergency(type, location, () => {
        document.getElementById("modalEmLocation").value = "";
        closeComplaintModal();
      });
    }

    async function submitEmergency(type, location, callback) {
      const res = await apiCall({
        action: "sendEmergency",
        playerCode: state.userData.playerCode,
        fullName: state.userData.fullName,
        type: type,
        location: location
      });
      if (res.status === "success") {
        alert("تم إرسال البلاغ بنجاح!");
        callback();
        fetchDashboardData(false);
      }
    }

    async function handlePoliceAction(actionType, rowId) {
      if (actionType === 'closeEmergency' && !confirm("تأكيد إغلاق القضية؟")) return;
      const res = await apiCall({ action: actionType, rowId: rowId, officerName: state.userData.fullName });
      if (res.status === "success") fetchDashboardData(false);
    }

    async function sendChatMessage(rowId) {
      const input = document.getElementById(`chatInput-${rowId}`);
      const text = input.value.trim();
      if (!text) return;

      const res = await apiCall({
        action: "sendChatMessage",
        rowId: rowId,
        senderName: state.userData.fullName,
        text: text,
        isPolice: state.userData.isPolice
      });

      if (res.status === "success") {
        input.value = "";
        fetchDashboardData(false);
      }
    }

    async function apiCall(data) {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      return await response.json();
    }

    function handleLogout() {
      localStorage.removeItem("falcon_email");
      location.reload();
    }
  </script>
</body>
</html>
